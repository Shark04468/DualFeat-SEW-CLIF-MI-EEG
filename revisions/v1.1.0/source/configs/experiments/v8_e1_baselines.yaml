experiment_id: V8_E1_BASELINES
protocol: bci2a_session_t_nested_six_fold_oof
architecture_version: v8_accuracy_first
schema_version: 1
stage: development

models:
  - eegnet
  - fbcnet
  - atcnet
  - tcformer
  - eeg_conformer
  - mi_snn_plif
  - bfatcnet
subjects: [1, 3, 8]

screening_seed: 0
confirmation_top_k: 1
confirmation_seeds: [0, 1, 2]
selection:
  session: T
  method: nested_six_fold_run_grouped_oof
  n_splits: 6
  split_seed: 0
  max_epochs: 300
  patience: 60
  minimum_outer_retrain_epochs: 40
  checkpoint_metric: validation_kappa
  ranking_metric: macro_subject_oof_accuracy

data_access:
  allowed_session: T
  heldout_session_e_accessed: false
  openbmi_session_s2_accessed: false

preprocessing:
  reference: CAR
  baseline_interval_seconds: [-1.0, 0.0]
  task_interval_seconds: [0.0, 4.0]
  gain: inner_train_channel_rms
  clip_after_gain: 12.0
  fbcnet_filterbank_hz:
    - [4, 8]
    - [8, 12]
    - [12, 16]
    - [16, 20]
    - [20, 24]
    - [24, 28]
    - [28, 32]
    - [32, 36]
    - [36, 40]
  model_views:
    eegnet:
      task_crop_seconds: [0.5, 2.5]
      anti_alias_resample_hz: 128
    eeg_conformer:
      zero_phase_bandpass_hz: [4, 40]
    fbcnet:
      causal_chebyshev_ii_filterbank: true
    all_others:
      task_crop_seconds: [0.0, 4.0]

augmentation:
  enabled: true
  parent_scope: current_inner_train_batch_only
  segments: 8
  probability: 0.5
  noise_std: 0.01
  scale_range: [0.9, 1.1]

source_fidelity:
  eegnet: tcformer_pinned_pytorch_module
  fbcnet: fbcnet_pinned_official_network_and_filterbank
  atcnet: tcformer_pinned_pytorch_module
  tcformer: tcformer_pinned_official_pytorch_module
  eeg_conformer: tcformer_pinned_pytorch_module
  mi_snn_plif: snnformi_architecture_torch_backend
  bfatcnet: paper_faithful_reconstruction_no_official_code

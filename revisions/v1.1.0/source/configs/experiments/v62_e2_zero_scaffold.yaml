experiment_id: V62_E2_ZERO_DELAY_SCAFFOLD
protocol: bci2a_subject_specific_t_to_e
architecture_version: dasp_snn_v6_2_r1
schema_version: 1

subjects: [1, 3, 8]
seeds: [0, 1, 2]
selection_seed: 0
selection:
  session: T
  method: six_fold_run_grouped
  n_splits: 6
  max_epochs: 200
  patience: 40
  minimum_epochs: 40
  selected_epoch_statistic: median
  minimum_final_epochs: 5
evaluation:
  session: E
  checkpoint_selection_allowed: false

model:
  n_channels: 22
  n_classes: 4
  n_bands: 9
  n_nodes: 22
  band_edges_hz:
    - [4.0, 8.0]
    - [8.0, 12.0]
    - [12.0, 16.0]
    - [16.0, 20.0]
    - [20.0, 24.0]
    - [24.0, 28.0]
    - [28.0, 32.0]
    - [32.0, 36.0]
    - [36.0, 40.0]
  sfreq: 250.0
  epoch_tmin: -1.0
  task_tmin: 0.0
  task_tmax: 4.0
  analytic_taps: 129
  envelope_taps: 33
  fast_decimation: 1
  spatial_rank: 4
  spatial_anchor_sigma: 0.12
  spatial_exact_sensor_basis: false
  freeze_spatial: true
  route_rank: 4
  delay_rank: 4
  fast_max_delay: 4
  slow_max_delay: 16
  fast_initial_contribution: 0.10
  phase_coupling_bound: 0.0
  target_interaction_bound: 0.0
  identity_delay_backbone: true
  residual_route_scale: 0.0
  initial_delay_fraction: 0.05
  dynamic_context_features: 0
  temporal_dilations: [1, 2, 4, 8]
  temporal_depth: 1
  temporal_scale_attention: false
  use_geometry: false
  geometry_components: 6
  geometry_windows_seconds: [0.25, 0.5, 1.0]
  snn_channels: 32
  decoder_layers: 0
  decoder_decays: [0.65, 0.90, 0.975]
  dropout: 0.50
  use_statistical_readout: true
  statistical_spatial_filters: 32
  statistical_features: 96
  statistical_compression_scale: 0.10
  statistical_fusion: statistics
  statistical_components: [carrier_log_variance]
  statistical_encoder: fbc
  statistical_temporal_segments: 4
  statistical_variance_transform: log
  statistical_post_spatial_activation: fbc_scb
  statistical_classifier_max_norm: 0.5
  parameter_ceiling: 220000

training:
  batch_size: 16
  gradient_accumulation_steps: 1
  effective_batch_size: 16
  learning_rate: 0.001
  weight_decay: 0.0
  max_gradient_norm: 5.0
  auxiliary_endpoint_weights: [0.0, 0.0, 0.0]
  selection_metric: kappa
  optimizer: AdamW
  schedule: false

augmentation:
  enabled: true
  parent_scope: current_inner_train_batch_only
  paired_fast_slow_segments: 8
  probability: 0.5
  carrier_scale_range: [0.9, 1.1]

preprocessing:
  frontend: official_fbc_chebyshev_ii
  reference: CAR
  baseline_interval_seconds: [-1.0, 0.0]
  task_interval_seconds: [0.0, 4.0]
  fixed_filterbank: true
  fixed_physical_spatial_basis: true
  gain: inner_train_channel_rms_before_official_filterbank
  clip_after_gain: 12.0
  cache_boundary: pre_delay_dual_rate_features
  fast_rate_hz: 250.0
  slow_rate_hz: 125.0

control:
  delay_override: zero
  trainable_route_edge_phase_strength_and_gain: true
  fixed_phase_preference_zero: true
  trainable_delay_coordinates: false
  mandatory_delay_bottleneck: true
  decoder_kind: ann

gate:
  baseline_stage: E1
  aggregation: mean_over_subject_seed_runs
  maximum_gap_pp: 0.5
  pass_rule: zero_scaffold_accuracy_at_least_strongest_baseline_minus_gap

experiment_id: V8_E5_MATCHED_TRANSPORT_HPO
schema: dpc-snn-v8-e5-matched-transport-hpo/v1
stage: development_hpo
protocol: bci2a_session_t_inner_validation_only

subjects: [1, 3, 8]
classifier_seed: 0
maximum_unique_configurations: 24
candidate_order_seed: 20260720
variant: sew_clif
delay_override_for_selection: zero

candidate_factors:
  decoder_channels:
    c16: 16
    c32: 32
  decoder_layers:
    l1: 1
    l2: 2
  temporal_decimation:
    full_rate: 1
    half_rate: 2
  learning_rate:
    lr_5e4: 0.0005
    lr_10e4: 0.001
    lr_20e4: 0.002

successive_halving:
  stage_1:
    active_folds: [0]
    max_epochs: 12
    minimum_epochs: 8
    patience: 12
    promote_top_k: 6
  stage_2:
    active_folds: [0, 3]
    max_epochs: 24
    minimum_epochs: 8
    patience: 24
    promote_top_k: 2
  stage_3:
    active_folds: [0, 1, 2, 3, 4, 5]
    max_epochs: 40
    minimum_epochs: 8
    patience: 40
    promote_top_k: 1

selection:
  session: T
  split_method: nested_six_fold_run_grouped
  split_seed: 0
  evaluation_role: inner_validation_only
  checkpoint_metric: fused_anchor_residual_validation_kappa
  primary_metric: subject_macro_mean_validation_kappa
  tie_breakers:
    - subject_macro_mean_validation_accuracy
    - lower_subject_macro_mean_validation_nll
    - lower_parameter_count
    - candidate_id
  outer_test_signals_forbidden: true
  outer_test_labels_forbidden: true
  full_delay_metrics_forbidden: true

fixed_contract:
  base_config: configs/experiments/v8_e3_matched_transport_campaign.yaml
  primary_variant: sew_clif
  matched_ann_variant: ann_sew
  scheduler_epochs: 40
  batch_size: 4
  gradient_accumulation_steps: 2
  effective_batch_size: 8
  weight_decay: 0.001
  firing_rate_weight: 0.02
  residual_fusion_mode: anchor_entropy
  maximum_expert_weight: 0.05
  prior_scope: subject_fold_fixed_across_candidates

execution:
  workers: 2
  worker_cpu_threads: 8

data_access:
  allowed_session: T
  heldout_session_e_accessed: false
  openbmi_session_s2_accessed: false

output_contract:
  selected_e3_config: selected_e3_config.yaml
  requires_fresh_formal_e3_outer_oof_after_selection: true

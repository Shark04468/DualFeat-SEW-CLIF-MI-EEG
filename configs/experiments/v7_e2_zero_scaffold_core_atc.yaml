experiment_id: V7_E2_ZERO_DELAY_CORE_ATC
protocol: bci2a_subject_specific_t_to_e
architecture_version: dasp_snn_v7
schema_version: 1

subjects: [1, 3, 8]
seeds: [0, 1, 2]
selection_seed: 0
selection:
  session: T
  method: six_fold_run_grouped
  n_splits: 6
  max_epochs: 300
  patience: 60
  minimum_epochs: 40
  selected_epoch_statistic: median
  minimum_final_epochs: 40
evaluation:
  session: E
  checkpoint_selection_allowed: false

model:
  n_channels: 22
  n_classes: 4
  n_bands: 12
  n_nodes: 22
  band_edges_hz:
    - [6.0, 8.0]
    - [8.0, 10.0]
    - [10.0, 12.0]
    - [12.0, 14.0]
    - [14.0, 17.0]
    - [17.0, 20.0]
    - [20.0, 23.0]
    - [23.0, 26.0]
    - [26.0, 30.0]
    - [30.0, 34.0]
    - [34.0, 37.0]
    - [37.0, 40.0]
  sfreq: 250.0
  epoch_tmin: -1.0
  task_tmin: 0.0
  task_tmax: 4.0
  analytic_taps: 129
  envelope_taps: 33
  fast_decimation: 1
  spatial_rank: 4
  spatial_anchor_sigma: 0.12
  spatial_exact_sensor_basis: true
  freeze_spatial: true
  route_rank: 4
  delay_rank: 4
  fast_max_delay: 4
  slow_max_delay: 16
  fast_initial_contribution: 0.10
  phase_coupling_bound: 0.0
  target_interaction_bound: 0.0
  identity_delay_backbone: true
  residual_route_scale: 0.0
  initial_delay_fraction: 0.05
  dynamic_context_features: 0
  temporal_dilations: [1, 2, 4, 8]
  temporal_depth: 1
  temporal_scale_attention: false
  use_geometry: false
  snn_channels: 32
  decoder_layers: 0
  decoder_decays: [0.65, 0.90, 0.975]
  dropout: 0.30
  use_statistical_readout: false
  use_atc_readout: true
  atc_readout_variant: official_full_window
  atc_reconstruct_sensors: true
  atc_delayed_residual_bound: 0.25
  atc_delayed_fusion_mode: amplitude_modulation
  atc_delayed_statistics_bins: 16
  atc_delayed_statistics_interaction_gain: 0.0
  atc_delayed_statistics_uncertainty_gate: false
  atc_temporal_filters: 16
  atc_depth_multiplier: 2
  atc_temporal_kernel: 64
  atc_first_pool: 8
  atc_second_pool: 7
  atc_convolution_dropout: 0.30
  atc_key_features: 8
  atc_attention_heads: 2
  atc_attention_dropout: 0.50
  atc_tcn_depth: 2
  atc_tcn_kernel: 4
  atc_tcn_dropout: 0.30
  atc_windows: 5
  parameter_ceiling: 220000

training:
  batch_size: 48
  gradient_accumulation_steps: 1
  effective_batch_size: 48
  learning_rate: 0.0009
  weight_decay: 0.001
  beta1: 0.5
  max_gradient_norm: 5.0
  auxiliary_endpoint_weights: [0.0, 0.0, 0.0]
  selection_metric: kappa
  optimizer: AdamW
  schedule: true
  scheduler_warmup_epochs: 20
  scheduler_step_unit: epoch
  reseed_before_training: false
  official_core_parity_mode: true

augmentation:
  enabled: true
  parent_scope: current_inner_train_batch_only
  paired_fast_slow_segments: 8
  probability: 0.5
  carrier_scale_range: [0.9, 1.1]
  noise_std: 0.01

preprocessing:
  frontend: analytic_fir_fixed_channel_gain
  reference: CAR
  baseline_interval_seconds: [-1.0, 0.0]
  task_interval_seconds: [0.0, 4.0]
  fixed_filterbank: true
  fixed_physical_spatial_basis: true
  gain: inner_train_channel_rms_before_analytic_filterbank
  clip_after_gain: 12.0
  cache_boundary: pre_delay_dual_rate_features
  fast_rate_hz: 250.0
  slow_rate_hz: 125.0

control:
  delay_override: zero
  mandatory_delay_bottleneck: true
  mandatory_broadband_transport: true
  multiband_delay_modules_present: true
  delayed_multiband_residual_scale: 0.0
  full_window_readout: official_atcnet_locked_source
  prefix_logits_valid: false
  decoder_kind: ann

gate:
  baseline_stage: E1
  aggregation: mean_over_subject_seed_runs
  maximum_gap_pp: 0.5
  pass_rule: zero_scaffold_accuracy_at_least_strongest_baseline_minus_gap

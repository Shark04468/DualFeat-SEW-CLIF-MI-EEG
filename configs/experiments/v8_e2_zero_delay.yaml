experiment_id: V8_E2_ZERO_DELAY
protocol: bci2a_session_t_nested_six_fold_oof
architecture_version: dpc_snn_v8_accuracy_first_r4_gain_invariant_envelope
schema_version: 1
stage: development

subjects: [1, 3, 8]
screening_seed: 0
confirmation_top_k: 1
confirmation_seeds: [0, 1, 2]
required_confirmation_variants: [full_ann]

variants:
  statistics_ann:
    use_statistical_branch: true
    use_covariance_branch: false
    use_temporal_branch: false
    decoder_kind: ann
    delay_auxiliary_enabled: false
  statistics_covariance_ann:
    use_statistical_branch: true
    use_covariance_branch: true
    use_temporal_branch: false
    decoder_kind: ann
    delay_auxiliary_enabled: false
  full_ann:
    use_statistical_branch: true
    use_covariance_branch: true
    use_temporal_branch: true
    decoder_kind: ann
    delay_auxiliary_enabled: false

selection:
  session: T
  method: nested_six_fold_run_grouped_oof
  n_splits: 6
  split_seed: 0
  max_epochs: 200
  patience: 30
  minimum_epochs: 30
  minimum_outer_retrain_epochs: 30
  checkpoint_metric: validation_kappa
  ranking_metric: macro_subject_oof_accuracy

training:
  batch_size: 4
  gradient_accumulation_steps: 2
  effective_batch_size: 8
  learning_rate: 0.0007
  weight_decay: 0.001
  max_gradient_norm: 5.0
  warmup_fraction: 0.10
  endpoint_weights: [0.0, 0.15, 0.35, 0.0]
  endpoint_loss_weight: 0.20
  firing_rate_weight: 0.0
  spatial_orthogonality_weight: 0.0001
  statistical_orthogonality_weight: 0.0001
  label_smoothing: 0.05

augmentation:
  enabled: true
  parent_scope: current_inner_or_outer_train_batch_only
  segments: 8
  probability: 0.5
  carrier_scale_range: [0.9, 1.1]

preprocessing:
  session: T
  reference: CAR
  baseline_interval_seconds: [-1.0, 0.0]
  task_interval_seconds: [0.0, 4.0]
  filterbank: fixed_causal_analytic_12_band
  physical_basis: frozen_exact_22_sensor_basis
  gain: fold_train_inverse_physical_carrier_rms
  cache_boundary: unit_gain_physical_fast_and_gain_invariant_relative_envelope_rates
  cache_gain_relative_tolerance: 1.0e-6
  fast_rate_hz: 125.0
  slow_rate_hz: 62.5
  cache_slow_gain_invariance_tolerance: 1.0e-5

data_access:
  allowed_session: T
  heldout_session_e_accessed: false
  openbmi_session_s2_accessed: false

gate:
  baseline_stage: E1
  maximum_gap_pp: 0.5
  aggregation: subject_macro_mean_after_within_subject_seed_average
  pass_rule: required_full_ann_at_least_strongest_baseline_minus_gap

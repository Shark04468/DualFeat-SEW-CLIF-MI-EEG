experiment_id: V8_E5_BOUNDED_SESSION_T_HPO
protocol: bci2a_session_t_inner_validation_only
architecture_version: dpc_snn_v8_accuracy_first_r4_gain_invariant_envelope
schema_version: 1
stage: development

subjects: [1, 3, 8]
seed: 0
maximum_unique_configurations: 24
candidate_order_seed: 20260718

candidate_factors:
  spatial_profile:
    base:
      spatial_rank: 4
      statistical_spatial_filters: 8
      covariance_features_per_band: 4
    enhanced:
      spatial_rank: 6
      statistical_spatial_filters: 16
      covariance_features_per_band: 8
  statistical_segments:
    four:
      statistical_segments: 4
    eight:
      statistical_segments: 8
  temporal_profile:
    compact:
      temporal_depth: 2
      temporal_dilations: [1, 2, 4, 8]
    extended:
      temporal_depth: 3
      temporal_dilations: [1, 2, 4, 8, 16]
  optimizer_profile:
    lr_3e4:
      learning_rate: 0.0003
    lr_7e4:
      learning_rate: 0.0007
    lr_12e4:
      learning_rate: 0.0012

fixed_model:
  use_statistical_branch: true
  use_covariance_branch: true
  use_temporal_branch: true
  decoder_kind: ann
  decoder_residual_mode: sew_add
  delay_auxiliary_enabled: false
  parameter_ceiling: 700000

successive_halving:
  stage_1:
    active_folds: [0, 3]
    max_epochs: 60
    patience: 15
    minimum_epochs: 20
    promote_top_k: 6
  stage_2:
    active_folds: [0, 2, 4]
    max_epochs: 120
    patience: 20
    minimum_epochs: 30
    promote_top_k: 2
  stage_3:
    active_folds: [0, 1, 2, 3, 4, 5]
    max_epochs: 200
    patience: 30
    minimum_epochs: 30
    promote_top_k: 1

selection:
  session: T
  split_method: nested_six_fold_run_grouped
  n_splits: 6
  split_seed: 0
  evaluation_role: inner_validation_only
  primary_metric: subject_macro_mean_validation_kappa
  tie_breakers: [subject_macro_mean_validation_accuracy, lower_parameter_count, candidate_id]
  outer_test_predictions_forbidden: true

training:
  batch_size: 4
  gradient_accumulation_steps: 2
  effective_batch_size: 8
  weight_decay: 0.001
  max_gradient_norm: 5.0
  warmup_fraction: 0.10
  endpoint_weights: [0.0, 0.15, 0.35, 0.0]
  endpoint_loss_weight: 0.20
  firing_rate_weight: 0.0
  spatial_orthogonality_weight: 0.0001
  statistical_orthogonality_weight: 0.0001
  label_smoothing: 0.05

augmentation:
  enabled: true
  parent_scope: current_inner_train_batch_only
  segments: 8
  probability: 0.5
  carrier_scale_range: [0.9, 1.1]

preprocessing:
  session: T
  reference: CAR
  baseline_interval_seconds: [-1.0, 0.0]
  task_interval_seconds: [0.0, 4.0]
  filterbank: fixed_causal_analytic_12_band
  physical_basis: frozen_exact_22_sensor_basis
  gain: fold_train_inverse_physical_carrier_rms
  cache_boundary: unit_gain_physical_fast_and_gain_invariant_relative_envelope_rates
  cache_gain_relative_tolerance: 1.0e-6
  fast_rate_hz: 125.0
  slow_rate_hz: 62.5
  cache_slow_gain_invariance_tolerance: 1.0e-5

data_access:
  allowed_session: T
  heldout_session_e_accessed: false
  openbmi_session_s2_accessed: false

output_contract:
  selected_model_config: selected_model.yaml
  selected_e2_config: selected_e2_config.yaml
  selected_variant: hpo_selected_full_ann
  requires_fresh_nested_e2_outer_oof_after_selection: true

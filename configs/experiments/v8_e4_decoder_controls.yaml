experiment_id: V8_E4_MATCHED_DECODER_CONTROLS
protocol: bci2a_session_t_nested_six_fold_oof
architecture_version: dpc_snn_v8_accuracy_first_r4_gain_invariant_envelope
schema_version: 1
stage: development

subjects: [1, 3, 8]
seeds: [0, 1, 2]
reference_variant: ann_residual

variants:
  ann_residual:
    decoder_kind: ann
    decoder_residual_mode: sew_add
    delay_auxiliary_enabled: false
  plif_plain:
    decoder_kind: plif
    decoder_residual_mode: plain
    delay_auxiliary_enabled: false
  clif_plain:
    decoder_kind: clif
    decoder_residual_mode: plain
    delay_auxiliary_enabled: false
  sew_clif:
    decoder_kind: clif
    decoder_residual_mode: sew_add
    delay_auxiliary_enabled: false

selection:
  session: T
  method: nested_six_fold_run_grouped_oof
  n_splits: 6
  split_seed: 0
  max_epochs: 200
  patience: 30
  minimum_epochs: 30
  minimum_outer_retrain_epochs: 30
  checkpoint_metric: validation_kappa

training:
  batch_size: 4
  gradient_accumulation_steps: 2
  effective_batch_size: 8
  learning_rate: 0.0007
  weight_decay: 0.001
  max_gradient_norm: 5.0
  warmup_fraction: 0.10
  endpoint_weights: [0.0, 0.15, 0.35, 0.0]
  endpoint_loss_weight: 0.20
  firing_rate_weight: 0.0
  spatial_orthogonality_weight: 0.0001
  statistical_orthogonality_weight: 0.0001
  label_smoothing: 0.05

augmentation:
  enabled: true
  parent_scope: current_inner_or_outer_train_batch_only
  segments: 8
  probability: 0.5
  carrier_scale_range: [0.9, 1.1]

preprocessing:
  session: T
  reference: CAR
  baseline_interval_seconds: [-1.0, 0.0]
  task_interval_seconds: [0.0, 4.0]
  filterbank: fixed_causal_analytic_12_band
  physical_basis: frozen_exact_22_sensor_basis
  gain: fold_train_inverse_physical_carrier_rms
  cache_boundary: unit_gain_physical_fast_and_gain_invariant_relative_envelope_rates
  cache_gain_relative_tolerance: 1.0e-6
  fast_rate_hz: 125.0
  slow_rate_hz: 62.5
  cache_slow_gain_invariance_tolerance: 1.0e-5

capacity_control:
  identical_trainable_parameter_count: true
  identical_trainable_parameter_shape_multiset: true
  permitted_config_differences: [decoder_kind, decoder_residual_mode]
  matched_frontend: true
  matched_training_budget: true

data_access:
  allowed_session: T
  heldout_session_e_accessed: false
  openbmi_session_s2_accessed: false

gate:
  ann_reference: ann_residual
  maximum_snn_accuracy_gap_pp: 0.3
  minimum_early_endpoint_gain_pp: 0.5
  minimum_activity_density_reduction: 0.5
  minimum_nondegenerate_snn_activity_rate: 0.005
  maximum_sparse_snn_activity_rate: 0.25
  selection: highest_subject_macro_final_accuracy_then_fixed_variant_order
  utility_win: final_accuracy_or_early_accuracy_or_activity_sparsity_proxy
  note: activity sparsity is a software proxy; energy claims require E7 hardware-aware analysis

name: bci2a
kind: processed_npz
# Versioned strict export: explicit 250 Hz MOABB resampling plus the original
# 22-channel EEG order. The legacy export omitted channel metadata.
root: data/processed/bci2a_strict
sfreq: 250
n_channels: 22
n_classes: 4
eeg_channels_only: true
sessions: ["T", "E"]
subjects: [1, 2, 3, 4, 5, 6, 7, 8, 9]
epoch:
  tmin: -1.0
  tmax: 4.0
preprocess:
  bands:
    broad: [4.0, 40.0]
    mu: [8.0, 13.0]
    beta: [13.0, 30.0]
  standardize: train_channel_zscore
  artifact_policy: record_and_configure
